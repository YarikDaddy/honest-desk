name: desk

# Раз в 15 минут: тик деска + отчёт, результат коммитится в репо — публичный журнал с таймстемпами.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desk
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run tick
      - run: npm run report > /dev/null
      - name: Commit the log
        run: |
          git config user.name "honest-desk-bot"
          git config user.email "honest-desk-bot@users.noreply.github.com"
          git add data REPORT.md
          git diff --cached --quiet && exit 0
          git commit -m "desk: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
